name: Publish to PyPI

# Builds the package and publishes it to PyPI when a release is published on GitHub.
# PyPI trusts this workflow (trusted publishing), so no API token is needed.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the wheel and the source distribution
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Store the distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/motulator-impedance
    permissions:
      id-token: write  # Needed for trusted publishing
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
